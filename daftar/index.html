<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Registrasi Valtherians</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="../assets/register.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/shared-BhyKLrjU.js">
    <link rel="stylesheet" crossorigin href="../assets/shared-FCsielAh.css">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="../database.css">
  </head>
  <body data-page="register">
    <!-- Halaman tersembunyi: tidak ada di menu. Navbar, hero, dan footer dibuat oleh assets/layout.js. -->
    <main class="container">
      <!-- 1. Form registrasi -->
      <section class="card" id="register-card">
        <h2 class="sec-title">Buat ID Aspirant</h2>
        <p class="sec-sub">Masukkan nama dan Emblem yang kamu terima dari Triune.</p>
        <form id="reg-form" class="redeem-form" autocomplete="off">
          <label for="reg-name">Nama</label>
          <input id="reg-name" type="text" maxlength="30" placeholder="Nama yang akan tampil" />
          <label for="reg-pin">Emblem</label>
          <input id="reg-pin" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" />
          <div class="redeem-actions"><button class="btn-gold" type="submit">Daftar</button></div>
        </form>
        <div id="reg-result" aria-live="polite"></div>
      </section>

      <!-- 2. Muncul setelah berhasil -->
      <div id="done" hidden></div>

      <!-- 3. Lanjutkan training (kalau halaman sempat tertutup) -->
      <section class="card" id="resume-card">
        <h2 class="sec-title">Lanjutkan Training</h2>
        <p class="sec-sub">Sudah punya ID? Masuk dengan ID dan Emblem untuk memilih Arbiter atau sesi Training.</p>
        <form id="res-form" class="redeem-form" autocomplete="off">
          <label for="res-uid">ID</label>
          <input id="res-uid" type="text" placeholder="ID kamu" />
          <label for="res-pin">Emblem</label>
          <input id="res-pin" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" />
          <div class="redeem-actions"><button class="btn-gold" type="submit">Lanjutkan</button></div>
        </form>
        <div id="res-result" aria-live="polite"></div>
      </section>

      <!-- 4. Ganti nama -->
      <section class="card" id="rename-card">
        <h2 class="sec-title">Ganti nama</h2>
        <p class="sec-sub" id="rename-sub"></p>
        <form id="ren-form" class="redeem-form" autocomplete="off">
          <label for="ren-uid">ID</label>
          <input id="ren-uid" type="text" placeholder="ID kamu" />
          <label for="ren-pin">Emblem</label>
          <input id="ren-pin" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" />
          <label for="ren-name">Nama baru</label>
          <input id="ren-name" type="text" maxlength="30" placeholder="Nama baru" />
          <div class="redeem-actions"><button class="btn-gold" type="submit">Ganti nama</button></div>
        </form>
        <div id="ren-result" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
