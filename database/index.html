<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valthera Legion Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="../assets/database.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/shared-BhyKLrjU.js">
    <link rel="stylesheet" crossorigin href="../assets/shared-FCsielAh.css">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="../database.css">
  </head>
  <body data-page="database">
    <!-- Navbar, hero (logo + banner) dan footer dibuat otomatis oleh assets/layout.js.
         Teks, logo, dan banner diatur di assets/config.js. -->
    <main class="container">
      <section class="search card">
        <label for="uid-input">Cari Valtherians</label>
        <form id="search-form" autocomplete="off">
          <input id="uid-input" type="text" placeholder="Masukkan ID" />
          <button type="submit">Cari</button>
        </form>
        <div id="search-result" aria-live="polite"></div>
      </section>

      <section class="card">
        <h2 class="sec-title">Total Valtherians</h2>
        <div class="total-row">
          <span id="total-num" class="total-num">…</span>
          <span id="total-sub" class="total-sub"></span>
        </div>
      </section>

      <section class="card">
        <h2 class="sec-title">Triune</h2>
        <p class="sec-sub">Jajaran Triune Valthera Legion</p>
        <div id="triune" class="staff-grid"></div>
      </section>

      <section class="card">
        <h2 class="sec-title">Knighthood</h2>
        <p class="sec-sub" id="member-sub">Jumlah Valtherians per rank</p>
        <div id="member-stats" class="stat-grid"></div>
        <p id="stats-note" class="stats-note"></p>
      </section>
    </main>
  </body>
</html>
